name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The manual PDFs are rendered from docs/manual/<lang>/*.html at deploy
      # time so the download always matches the HTML on the same commit.
      - name: Install PDF toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-inter
          python -m pip install -q -e . playwright
          python -m playwright install --with-deps chromium

      - name: Check manual tables match the code
        run: python scripts/sync_manual_tables.py --check

      - name: Render manual PDFs
        run: python scripts/build_manual_pdf.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
