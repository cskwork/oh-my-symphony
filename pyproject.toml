[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-symphony"
version = "0.29.0"
description = "Multi-agent fork of OpenAI Symphony — supports Codex CLI, Claude Code CLI, Gemini CLI, AGY/Antigravity CLI, Kiro CLI, OpenCode CLI, Pi CLI, and Prime Agent CLI behind one local Kanban orchestrator with TUI and web board."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "oh-my-symphony" }]
dependencies = [
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
    "httpx>=0.27",
    "watchdog>=4.0",
    "aiohttp>=3.9",
    "rich>=13.7",
    "textual>=0.85",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    # The test suite exercises the PM workbook exchange; the PM Workspace
    # itself is the separate in-repo distribution `packages/pm`.
    "oh-my-symphony[pm-exchange]",
    "ruff>=0.8",
    "pyright>=1.1.390",
    # The full-source type gate includes the bundled SuperQA runtime.
    "playwright>=1.48",
    "pillow>=10.0",
]
browser = [
    "playwright>=1.48",
]
# Workbook exchange for the optional PM Workspace (`packages/pm`).
pm-exchange = [
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "et-xmlfile==2.0.0",
]

[project.scripts]
symphony = "symphony.cli:main"
symphony-pyright = "symphony.pyright:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
symphony = [
    "templates/project/*.md",
    "templates/project/*.yaml",
    "templates/project/docs/symphony-prompts/file/*.md",
    "templates/project/docs/symphony-prompts/file/stages/*.md",
    "templates/project/docs/symphony-prompts/file/deep/*.md",
    "templates/project/scripts/*.sh",
    "templates/project/skills/**/*",
    "web/static/*",
    "factory/templates/*.md",
    "factory/templates/docs/symphony-prompts/file/*.md",
    "factory/templates/docs/symphony-prompts/file/stages/*.md",
    "factory/templates/scripts/*.sh",
    "factory/templates/wayfinder/*.md",
    "factory/bundled_skills/*.md",
    "factory/bundled_skills/*.json",
    "factory/bundled_skills/third_party_licenses/*.txt",
    "factory/bundled_skills/*/*.md",
    "factory/bundled_skills/*/LICENSE",
    "factory/bundled_skills/*/pyproject.toml",
    "factory/bundled_skills/*/agents/*.md",
    "factory/bundled_skills/*/reference/*.md",
    "factory/bundled_skills/*/scripts/*.sh",
    "factory/bundled_skills/*/templates/*.md",
    "factory/bundled_skills/*/templates/*.sh",
    "factory/bundled_skills/*/templates/*.mjs",
    "factory/bundled_skills/*/templates/*.json",
    "factory/bundled_skills/*/templates/*.html",
    "factory/bundled_skills/*/templates/*.js",
    "factory/bundled_skills/*/templates/*/*",
    "factory/bundled_skills/*/templates/*/.env.example",
    "factory/bundled_skills/*/templates/*/*/*",
    "factory/bundled_skills/*/templates/*/*/*/*",
    "factory/bundled_skills/*/superqa_tui/*.py",
    "factory/bundled_skills/*/superqa_tui/*.js",
    "factory/bundled_skills/*/superqa_tui/*.tcss",
    "web/static/**/*",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Default rule set, stated explicitly so the gate is stable across ruff
# upgrades. Ratchet: broaden (I, B, UP, ...) once the baseline is green.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export names for their public surface and for
# the documented test-monkeypatch indirection (see architecture.md).
"**/__init__.py" = ["F401"]

[tool.pyright]
# Ratchet: gate `src` first; tests carry deliberate loose patterns and
# join the gate after a burn-down pass.
# `packages/*/src` are the optional distributions (`symphony.pm`,
# `symphony.chat`, `symphony.release`).
include = ["src", "packages/pm/src", "packages/chat/src", "packages/release/src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser_e2e: browser-driven web UI tests; requires SYMPHONY_BROWSER_E2E=1 and Playwright browser binaries",
    "timing: wall-clock budget checks; run them serially (-n0), never beside parallel workers",
]
