name: symphony-pm
version: 1
description: Human-reviewed planning with UX, design, and an editable WBS
artifacts:
  - id: proposal
    generates: proposal.md
    description: Define the problem and bounded outcome
    template: proposal.md
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Specify observable behavior and failure scenarios
    template: spec.md
    requires: [proposal]
  - id: ux
    generates: ux.md
    description: Describe screens, storyboard, and interaction states
    template: ux.md
    requires: [specs]
  - id: design
    generates: design.md
    description: Define architecture, data, contracts, and integration
    template: design.md
    requires: [specs]
  - id: tasks
    generates: tasks.md
    description: Define stable implementation work packages and checks
    template: tasks.md
    requires: [specs, ux, design]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Execution is handed off through Symphony after human approval.
    Do not start coding, approve scope, or rewrite shared task progress here.
