groups:
- key: G1
  title: Request and approval
  tasks:
  - key: T1
    title: Leave request API and storage
    kind: Backend
    description: Store leave requests, refuse overlapping dates, and record team-manager decisions.
    acceptance:
    - Valid requests become Pending; overlapping dates are refused.
    - Approval notifies the employee; a decline requires a reason.
    - Wrong-team and competing decisions are refused.
    verification:
    - Run demo-check for request, decision, concurrency, and retry cases.
    integration_impact: Adds leave request storage, two API endpoints, and approval notifications.
    requirement_refs:
    - '{{ID:submit_request}}'
    - '{{ID:request_pending}}'
    - '{{ID:overlap_refused}}'
    - '{{ID:decide_request}}'
    - '{{ID:approval_notifies}}'
    - '{{ID:decline_reason_required}}'
    storyboard_refs:
    - '{{ID:request_form}}'
    - '{{ID:manager_inbox}}'
    design_refs:
    - '{{ID:submit_leave}}'
    - '{{ID:decide_leave}}'
    depends_on: []
    verification_policy:
    - procedure_id: demo-check
      kind: native
  - key: T2
    title: Request form
    kind: Frontend
    description: Build the leave date form and show saved status or a clear validation error.
    acceptance:
    - A valid submission shows dates and Pending status.
    - Overlap and invalid dates keep entered values and explain the error.
    verification:
    - Run demo-check for form submission and validation.
    - Use demo-review for date entry, narrow screens, keyboard use, and error recovery.
    integration_impact: Uses the leave request endpoint and provides the date picker reused by the calendar.
    requirement_refs:
    - '{{ID:submit_request}}'
    - '{{ID:request_pending}}'
    - '{{ID:overlap_refused}}'
    storyboard_refs:
    - '{{ID:request_form}}'
    design_refs:
    - '{{ID:submit_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
  - key: T3
    title: Manager inbox
    kind: Frontend
    description: Show Pending requests for the manager's team and support approval or decline with a reason.
    acceptance:
    - Approval removes the request from the Pending list and confirms the decision.
    - A missing decline reason keeps the request Pending.
    - A valid decline saves the reason and Declined status.
    verification:
    - Run demo-check for inbox decisions and refusal cases.
    - Use demo-review for decision controls, focus, and error messages.
    integration_impact: Uses the decision endpoint; approval notifications are handled by the backend.
    requirement_refs:
    - '{{ID:decide_request}}'
    - '{{ID:approval_notifies}}'
    - '{{ID:decline_reason_required}}'
    storyboard_refs:
    - '{{ID:manager_inbox}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
- key: G2
  title: Team calendar
  tasks:
  - key: T4
    title: Approved-leave feed
    kind: Backend
    description: Read Approved leave for the signed-in user's team and selected month.
    acceptance:
    - The feed includes only Approved requests for the user's team.
    - Each included date appears; Pending, Declined, and other-team requests are excluded.
    verification:
    - Run demo-check for calendar status, team, and date filtering.
    integration_impact: Adds the calendar read path to the Leave API using the request store.
    requirement_refs:
    - '{{ID:approved_calendar}}'
    - '{{ID:calendar_approved_only}}'
    storyboard_refs:
    - '{{ID:team_calendar}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
  - key: T5
    title: Calendar screen
    kind: Frontend
    description: Display the team's approved leave by month with employee names and dates.
    acceptance:
    - Approved leave appears on every included day.
    - Empty months, loading, and failures have clear messages.
    - Names and dates remain readable without relying on color.
    verification:
    - Run demo-check for calendar rendering and month navigation.
    - Use demo-review for date picker reuse, narrow screens, keyboard use, and retry.
    integration_impact: Uses the approved-leave feed and reuses the request form's date picker.
    requirement_refs:
    - '{{ID:approved_calendar}}'
    - '{{ID:calendar_approved_only}}'
    storyboard_refs:
    - '{{ID:team_calendar}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T4
      kind: requires_code
    - task: T2
      kind: order_only
      justification: Reuse the form's date picker.
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
