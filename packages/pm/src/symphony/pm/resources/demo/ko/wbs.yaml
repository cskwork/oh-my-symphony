groups:
- key: G1
  title: 신청과 승인
  tasks:
  - key: T1
    title: 휴가 신청 API와 저장
    kind: Backend
    description: 휴가 신청을 저장하고 겹치는 날짜를 거절하며 팀 관리자의 처리 결과를 기록합니다.
    acceptance:
    - 유효한 신청은 승인 대기로 저장하고 날짜가 겹치면 거절합니다.
    - 승인하면 직원에게 알리고 반려하려면 사유가 필요합니다.
    - 다른 팀 신청에 대한 처리와 동시에 들어온 서로 충돌하는 처리 결과는 거절합니다.
    verification:
    - demo-check로 신청, 처리 결과, 동시 요청, 재시도를 확인합니다.
    integration_impact: 휴가 신청 저장 공간, API 두 개, 승인 알림을 추가합니다.
    requirement_refs:
    - '{{ID:submit_request}}'
    - '{{ID:request_pending}}'
    - '{{ID:overlap_refused}}'
    - '{{ID:decide_request}}'
    - '{{ID:approval_notifies}}'
    - '{{ID:decline_reason_required}}'
    storyboard_refs:
    - '{{ID:request_form}}'
    - '{{ID:manager_inbox}}'
    design_refs:
    - '{{ID:submit_leave}}'
    - '{{ID:decide_leave}}'
    depends_on: []
    verification_policy:
    - procedure_id: demo-check
      kind: native
  - key: T2
    title: 휴가 신청 화면
    kind: Frontend
    description: 휴가 날짜를 입력하고 저장 결과 또는 입력 오류를 보여주는 화면을 만듭니다.
    acceptance:
    - 유효한 신청의 날짜와 승인 대기 상태를 보여줍니다.
    - 날짜 중복이나 잘못된 날짜는 입력값을 유지하고 오류를 설명합니다.
    verification:
    - demo-check로 신청과 입력값 검사를 확인합니다.
    - demo-review로 날짜 입력, 좁은 화면, 키보드 사용, 오류 후 재시도를 확인합니다.
    integration_impact: 휴가 신청 API를 사용하고 달력에서도 쓸 날짜 선택 기능을 만듭니다.
    requirement_refs:
    - '{{ID:submit_request}}'
    - '{{ID:request_pending}}'
    - '{{ID:overlap_refused}}'
    storyboard_refs:
    - '{{ID:request_form}}'
    design_refs:
    - '{{ID:submit_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
  - key: T3
    title: 관리자 검토함
    kind: Frontend
    description: 자기 팀의 승인 대기 신청을 보여주고 승인 또는 사유가 있는 반려를 지원합니다.
    acceptance:
    - 승인하면 승인 대기 목록에서 신청이 사라지고 결과를 확인할 수 있습니다.
    - 반려 사유가 없으면 신청은 승인 대기로 남습니다.
    - 유효한 반려는 사유와 반려 상태를 저장합니다.
    verification:
    - demo-check로 승인, 반려, 처리 거절을 확인합니다.
    - demo-review로 처리 버튼, 초점 이동, 오류 안내를 확인합니다.
    integration_impact: 신청 처리 API를 사용하며 승인 알림은 백엔드가 담당합니다.
    requirement_refs:
    - '{{ID:decide_request}}'
    - '{{ID:approval_notifies}}'
    - '{{ID:decline_reason_required}}'
    storyboard_refs:
    - '{{ID:manager_inbox}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
- key: G2
  title: 팀 달력
  tasks:
  - key: T4
    title: 승인된 휴가 조회
    kind: Backend
    description: 로그인한 사용자의 팀과 선택한 달에 해당하는 승인된 휴가를 조회합니다.
    acceptance:
    - 사용자의 팀에서 승인된 신청만 조회합니다.
    - 휴가 기간의 모든 날짜를 포함하고 승인 대기, 반려, 다른 팀의 신청은 제외합니다.
    verification:
    - demo-check로 달력의 상태, 팀, 날짜 필터를 확인합니다.
    integration_impact: 휴가 저장소를 사용해 휴가 API에 달력 조회 기능을 추가합니다.
    requirement_refs:
    - '{{ID:approved_calendar}}'
    - '{{ID:calendar_approved_only}}'
    storyboard_refs:
    - '{{ID:team_calendar}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T1
      kind: requires_code
    verification_policy:
    - procedure_id: demo-check
      kind: native
  - key: T5
    title: 팀 달력 화면
    kind: Frontend
    description: 팀의 승인된 휴가를 월별로 표시하고 직원 이름과 날짜를 보여줍니다.
    acceptance:
    - 승인된 휴가를 기간에 포함된 모든 날짜에 표시합니다.
    - 빈 달, 불러오는 중, 오류 상태를 명확히 안내합니다.
    - 색상에 의존하지 않고 이름과 날짜를 읽을 수 있습니다.
    verification:
    - demo-check로 달력 표시와 월 이동을 확인합니다.
    - demo-review로 날짜 선택 기능 재사용, 좁은 화면, 키보드 사용, 재시도를 확인합니다.
    integration_impact: 승인된 휴가 조회 기능을 사용하고 신청 화면의 날짜 선택 기능을 재사용합니다.
    requirement_refs:
    - '{{ID:approved_calendar}}'
    - '{{ID:calendar_approved_only}}'
    storyboard_refs:
    - '{{ID:team_calendar}}'
    design_refs:
    - '{{ID:decide_leave}}'
    depends_on:
    - task: T4
      kind: requires_code
    - task: T2
      kind: order_only
      justification: 신청 화면의 날짜 선택 기능을 재사용합니다.
    verification_policy:
    - procedure_id: demo-check
      kind: native
    - procedure_id: demo-review
      kind: manual
